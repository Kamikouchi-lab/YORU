# Projector demo: display feedback on a second screen.
# Model path and Arduino COM port are placeholders - set them for your setup
# (or use "Create new config" in the launcher).

name: yoru_demo_projecter # Experimental name
export: "./results/" # Output folder for videos and experiment information
export_name: "yoru_demo_projecter" # Base file name of the output video

model:
 yolo_detection: False # Start inference immediately after the real-time process opens
 yolo_model_path: "Path to YORU model" # Specify the YORU model (.pt / .onnx file)
 yolo_model_type: "auto" # Model type: "auto", "yolov8", "yolo11", "rtdetr", "fasterrcnn", "maskrcnn", "ssd", "onnx"
 Trigger: False

capture_style:
 stream_MSS: False # When using the screen capture function, set to True.

trigger:
 trigger_threshold_configuration: 0.5 # Confidence threshold for firing the trigger
 trigger_class: "person" # Which detected class fires the trigger
 Arduino_COM: "None" # COM port the Arduino is connected to ("None" = no device)
 trigger_pin: 13 # Digital pin used to output the TTL signal
 trigger_style: straight_display # Which trigger plugin to use

hardware:
 use_camera: True # Whether to use the camera
 camera_id: 1 # Camera ID
 camera_width: 1280 # Width (px) of images captured by the camera
 camera_height: 1024 # Height (px) of images captured by the camera
 camera_scale: 1 # Scale factor applied to the camera image
 camera_fps: 30 # Camera fps
 camera_imshow: False # When True, an extra OpenCV window opens
 camera_settings_dialog: False # When True, open the camera driver's property dialog on start
