<!DOCTYPE html>
<html>
<head>
    
    <title>YORU (Your Optimal Recognition Utility)</title>
    <script type="text/javascript" src="/eel.js"></script>
    <meta name="description" content="ページの紹介文">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="button-grid">
        <div class="button-container">
            <img src="../image/YORU_training_button.png" alt="Training" onclick="runProgram1()">
        </div>
        <div class="button-container">
            <img src="../image/YORU_evaluation_button.png" alt="Model Evaluation" onclick="runProgram4()">
        </div>
        <div class="button-container">
            <img src="../image/YORU_video_button.png" alt="Behavior Analysis" onclick="runProgram2()">
        </div>
        <div class="button-container">
            <img src="../image/YORU_realtime_button.png" alt="Real-time Behavior Detection" onclick="runProgram3()">
            <button onclick="showFileDialog()">Select</button>
            <p id="file-path">ここに文字が表示されます</p>
        </div>
    </div>

    <div id="error-display" style="display:none; margin:16px; padding:12px; background:#2d1111; border:1px solid #cc3333; border-radius:6px; color:#ff6666; max-height:300px; overflow-y:auto; font-size:13px;">
        <h3 style="margin:0 0 8px 0; color:#ff4444;">Error Log</h3>
    </div>

    <script type="text/javascript">
        function runProgram1() {
            eel.run_train_gui();
        }
    </script>

    <script type="text/javascript">
        function runProgram2() {
            eel.run_analysis_gui();
        }
    </script>

    <script type="text/javascript">
        function runProgram3() {
            eel.run_cam_gui_YMH();
        }
    </script>

    <script type="text/javascript">
        eel.print_file_path()(function(result){
            document.getElementById('file-path').innerText = result;
        });
    </script>



    <script>
        eel.expose(displayFilePath);
        function displayFilePath(path) {
            document.getElementById('file-path').innerText = path;
        }

        function showFileDialog() {
            eel.show_file_dialog();
        }

        eel.expose(displayError);
        function displayError(guiName, errorMsg) {
            var errorDiv = document.getElementById('error-display');
            var timestamp = new Date().toLocaleTimeString();
            var entry = document.createElement('div');
            entry.className = 'error-entry';
            entry.innerHTML = '<strong>[' + timestamp + '] ' + guiName + '</strong><pre>' + errorMsg + '</pre>';
            errorDiv.prepend(entry);
            errorDiv.style.display = 'block';
        }
    </script>

    <script type="text/javascript">
        function runProgram4() {
            eel.run_evaluate_gui();
        }
    </script>

</body>
</html>
