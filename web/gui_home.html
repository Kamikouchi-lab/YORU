<!DOCTYPE html>
<html>
<head>

    <title>YORU (Your Optimal Recognition Utility)</title>
    <meta name="description" content="YORU launcher">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="button-grid">
        <div class="button-container">
            <img src="image/YORU_training_button.png" alt="Training" onclick="runProgram1()">
        </div>
        <div class="button-container">
            <img src="image/YORU_evaluation_button.png" alt="Model Evaluation" onclick="runProgram4()">
        </div>
        <div class="button-container">
            <img src="image/YORU_video_button.png" alt="Behavior Analysis" onclick="runProgram2()">
        </div>
        <div class="button-container">
            <img src="image/YORU_realtime_button.png" alt="Real-time Behavior Detection" onclick="runProgram3()">
            <button onclick="showFileDialog()">Select</button>
            <p id="file-path">Loading config path...</p>
            <button onclick="runConfigCreator()">Create new config →</button>
        </div>
    </div>

    <script type="text/javascript">
        function waitForApi() {
            return new Promise(function(resolve) {
                if (window.pywebview && window.pywebview.api) {
                    resolve();
                    return;
                }
                window.addEventListener('pywebviewready', resolve);
            });
        }

        function displayError(message) {
            alert(message);
        }

        async function runProgram1() {
            await waitForApi();
            window.pywebview.api.run_train_gui();
        }

        async function runProgram2() {
            await waitForApi();
            window.pywebview.api.run_analysis_gui();
        }

        async function runProgram3() {
            await waitForApi();
            window.pywebview.api.run_realtime_gui();
        }

        async function runProgram4() {
            await waitForApi();
            window.pywebview.api.run_evaluate_gui();
        }

        async function showFileDialog() {
            await waitForApi();
            window.pywebview.api.show_file_dialog();
        }

        async function runConfigCreator() {
            await waitForApi();
            window.pywebview.api.run_config_creator_gui();
        }

        // Load the current config path on startup
        waitForApi().then(function() {
            window.pywebview.api.get_config_path().then(function(result) {
                document.getElementById('file-path').innerText = result;
            });
        });
    </script>

</body>
</html>
