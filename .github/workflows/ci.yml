name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The job only needs to read the repository; it installs and executes
# third-party packages, so it must not carry a write-capable token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install the project
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
