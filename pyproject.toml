[project]
name = "yoru_uv"
version = "1.1.1"
description = "YORU - Your Own Research Utility for real-time behavioral analysis"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "eel==0.16.0",
    "nidaqmx==0.9.0",
    # opencv-python 4.10.0.82 is built against the NumPy 1.x ABI; an unbounded
    # NumPy resolves to 2.x on Python 3.10+ and breaks `import cv2`.
    "numpy>=1.24.4,<2",
    "dearpygui==1.11.1",
    "opencv-python==4.10.0.82",
    "pyglet==2.0.15",
    "pyfirmata==1.1.0",
    "pyyaml==6.0.1",
    "pandas==2.0.3",
    "pynput==1.7.7",
    "labelImg>=1.8",
    "munkres==1.1.4",
    "matplotlib==3.7.5",
    "gitpython==3.1.43",
    "pillow==10.3.0",
    "psutil==5.9.8",
    "scipy==1.10.1",
    "seaborn==0.13.2",
    "requests==2.32.3",
    "thop",
    "tqdm==4.66.4",
    "ultralytics>=8.3.0",
    "ultralytics-thop==2.0.0",
    "mss==9.0.1",
    "scikit-image==0.21.0",
    "imgui==2.0.0",
    "pyopengl==3.1.7",
    "pyserial==3.5",
    # Windows-only, and not imported anywhere in the source tree.
    "pywin32==306; sys_platform == 'win32'",
    # pkg_resources was removed in setuptools 81 and eel still imports it.
    "setuptools<81",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
]

[project.scripts]
yoru = "yoru.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is named yoru_uv but the package directory is yoru, so
# hatchling cannot infer what to ship.
[tool.hatch.build.targets.wheel]
packages = ["yoru"]

[dependency-groups]
dev = [
    "pytest==7.4.0",
]

[tool.uv]
# One lockfile has to serve all three targets, so the resolution is forked
# explicitly instead of being pinned to whichever host last ran `uv lock`.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
# Force uv to pick versions that actually ship Apple-Silicon wheels rather than
# resolving to a version whose only macOS wheel is x86_64 (PyQt5-Qt5 does this).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# torchvision's detection heads diverge on MPS before 0.29 (measured: Avg Loss
# inf on 0.26.0 against 0.42-0.50 on 0.29.0), so macOS takes 0.29 or newer.
# That pulls torch 2.14, whose macOS wheels are macosx_14_0 -- hence the
# macOS 14 floor in the README.
constraint-dependencies = [
    "torchvision>=0.29; sys_platform == 'darwin'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# The cu124 index publishes only linux_x86_64 and win_amd64 wheels. macOS takes
# torch from PyPI instead, which is the build carrying Metal (MPS) support.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
